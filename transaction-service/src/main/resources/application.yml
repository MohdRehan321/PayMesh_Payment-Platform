
server:
  port: 8082

spring:
  application:
    name: transaction-service

  config:
    import: optional:file:.env.properties

  kafka:
    bootstrap-servers: ${KAFKA_SERVER}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    template:
      default-topic: transaction-events

  datasource:
    url: jdbc:postgresql://localhost:5432/transaction_db
    username: ${PAYMESH_DB_USERNAME:postgres}
    password: ${PAYMESH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

paymesh:
  gateway:
    secret: ${GATEWAY_INTERNAL_SECRET}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.paymesh.transaction_service: DEBUG
