server:
  port: 8082
  tomcat:
    basedir: C:/spring-temp

spring:
  application:
    name: transaction-service
  config:
    import: optional:file:.env.properties
  datasource:
    url: jdbc:postgresql://localhost:5432/transaction_db
    username: ${PAYMESH_DB_USERNAME:postgres}
    password: ${PAYMESH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_SERVER:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    template:
      default-topic: transaction-events
    consumer:
      group-id: transaction-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.paymesh.transaction_service.dto.UserCreatedEvent
        spring.json.use.type.headers: false
    listener:
      missing-topics-fatal: false

paymesh:
  gateway:
    secret: ${GATEWAY_INTERNAL_SECRET}
  kafka:
    topics:
      user-created: user-created

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.paymesh.transaction_service: DEBUG