server:
  port: 8081

spring:
  application:
    name: user-service
  config:
      import: optional:file:.env.properties
  datasource:
      url: jdbc:postgresql://localhost:5432/user_db
      username: ${PAYMESH_DB_USERNAME:postgres}
      password: ${PAYMESH_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
  jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
   secret: ${JWT_SECRET}
logging:
  level:
     org.springframework.cloud.gateway: TRACE
     reactor.netty.http.client: DEBUG
     com.paymesh.user_service: DEBUG